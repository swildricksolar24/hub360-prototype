# Builds Storybook and the prototype app and publishes both to GitHub Pages on every push to main:
#   Storybook  → https://swildricksolar24.github.io/hub360-prototype/
#   Prototype  → https://swildricksolar24.github.io/hub360-prototype/prototype/
name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build-storybook
        env:
          # Published Storybook opens in dark mode (UI, stories and docs); see .storybook/preview.tsx
          STORYBOOK_THEME: dark
      # Prototype app under /prototype/ (type check already ran above)
      - run: npx vite build
        env:
          APP_BASE: /hub360-prototype/prototype/
      - name: Add the app to the Pages site
        run: |
          mkdir -p storybook-static/prototype
          cp -r dist/. storybook-static/prototype/
          # Pages serves 404.html for unknown paths, so deep links like /prototype/sign-up still load the app
          cp dist/index.html storybook-static/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
